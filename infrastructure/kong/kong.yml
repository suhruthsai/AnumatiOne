_format_version: "3.0"

services:
  - name: approvalos-web
    url: http://approvalos-web:3000
    routes:
      - name: web-route
        paths:
          - /
        strip_path: false

  - name: approvalos-simulator-service
    url: http://approvalos-web:3000/api/v1/simulate
    routes:
      - name: simulate-route
        paths:
          - /api/v1/simulate
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 120
              policy: local

  - name: approvalos-doc-service
    url: http://approvalos-web:3000/api/v1/documents
    routes:
      - name: doc-route
        paths:
          - /api/v1/documents
        strip_path: false

  - name: approvalos-applications-service
    url: http://approvalos-web:3000/api/v1/applications
    routes:
      - name: apps-route
        paths:
          - /api/v1/applications
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Content-Type
        - Authorization
      credentials: true
